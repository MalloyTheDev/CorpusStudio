name: Engine Tests

on:
  push:
  pull_request:

# Least privilege: no job here needs write access.
permissions:
  contents: read

jobs:
  python-engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Do NOT leave the job token in .git/config: this job checks out
          # and RUNS repository code, including from an unreviewed branch.
          persist-credentials: false

      - name: Reject unresolved merge markers
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )'; then
            echo "Unresolved merge markers found in tracked files."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install engine
        # -c constraints.txt pins pydantic to the SAME version the schema-generation job (web.yml)
        # uses, so the engine is tested/type-checked against the exact pydantic that produced the
        # committed docs/contracts + apps/web/src/contracts. Single source: engine/constraints.txt.
        run: |
          cd engine
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt

      - name: Lint (ruff)
        run: |
          cd engine
          ruff check .

      - name: Type check (mypy)
        run: |
          cd engine
          mypy

      # mypy models ONE platform per run, and the bare invocation above models the host (linux).
      # The POSIX-only call sites (fcntl, resource, os.fchmod, os.sysconf) are guarded on
      # sys.platform so the checker can narrow them, which means a Windows-targeted run is clean and
      # a regression there is a real defect on a supported platform. Blocking from the start because
      # it already passes: see issues #969 and #973.
      - name: Type check for Windows (mypy --platform win32)
        run: |
          cd engine
          mypy --platform win32

      - name: Run tests with coverage
        run: |
          cd engine
          pytest --cov=corpus_studio --cov-report=term-missing --cov-report=xml

      # The coverage report is handed to a SEPARATE job to be uploaded. The token must never live in a
      # job that has executed repository code (see the coverage-upload job below).
      - name: Upload coverage report as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: engine-coverage
          path: engine/coverage.xml
          if-no-files-found: warn
          retention-days: 1

  # Windows is a SUPPORTED platform, but until now CI only ever ran Linux, so nothing stopped it
  # regressing. That is not hypothetical: three defects reached main invisibly because of it, the worst
  # being a checkpoint fsync that opened O_RDONLY and so failed with EBADF on every durable write,
  # inside a lane already marked workload_verified on Linux evidence. The suite now passes on Windows
  # (issues #969, #972, #973), and this job is what keeps it that way.
  #
  # Intentionally NOT a required status check yet (soak first), matching the convention in
  # security.yml: it informs, it does not block merges. No continue-on-error, so a failure stays
  # visible rather than being swallowed. Promote it to required once it has been green for a while.
  #
  # Python 3.11 matches the Linux job on purpose: holding the interpreter constant means a difference
  # between the two jobs is a PLATFORM difference and nothing else. A 3.12 axis is worth adding later,
  # since 3.12 venvs no longer seed setuptools (see the wheel-build prerequisite in engine/pyproject.toml).
  windows-engine:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v7
        with:
          # Same reasoning as the Linux job: this job RUNS repository code, so the job token must
          # not be left behind in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt

      # Report the privilege rather than discover it through a wall of failures. Creating a symlink on
      # Windows needs SeCreateSymbolicLinkPrivilege, which an unprivileged account lacks unless
      # Developer Mode is on; without it the symlink-escape refusal tests cannot even build their
      # fixture. Whichever way this prints, the log says so plainly (issue #972).
      - name: Report symlink capability
        # Explicit bash: the default shell on windows-latest is pwsh, where a multi-line quoted
        # Python string is a quoting hazard. A heredoc keeps the probe readable and shell-agnostic.
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tempfile

          root = pathlib.Path(tempfile.mkdtemp())
          (root / "target").write_text("x", encoding="utf-8")
          try:
              os.symlink(root / "target", root / "link")
              print("symlink: ALLOWED")
          except OSError as exc:
              print(f"symlink: REFUSED -> {exc}")
          PY

      - name: Run tests
        # No coverage here: the 88% floor is enforced once, on Linux, in the python-engine job.
        # This job exists to catch platform behaviour, not to re-measure coverage.
        run: pytest -q --no-header

  # Codecov receives CODECOV_TOKEN, so it runs in its OWN job that NEVER executes repository code: it
  # only downloads the coverage artifact. Previously this step lived in `python-engine`, where `pytest`
  # had already run the checked-out code earlier in the SAME job - so a change on an unreviewed branch
  # could influence the token-bearing step (via $GITHUB_ENV, $GITHUB_PATH, or a binary on PATH) before
  # any human saw it. That matters because this workflow triggers on a bare `push:`.
  coverage-upload:
    runs-on: ubuntu-latest
    needs: python-engine
    if: always() && needs.python-engine.result == 'success'
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: engine-coverage
        continue-on-error: true

      # Soft-fail: best-effort reporting that must never break the gate - it no-ops until a
      # CODECOV_TOKEN secret is configured for the repo.
      #
      # Pinned to an immutable commit SHA (not the mutable @v7 tag) because this third-party action
      # receives CODECOV_TOKEN: a moved/retagged upstream release must not run with the secret.
      # SHA is codecov/codecov-action tag v7 (fb8b3582 = v7 head at time of pinning); bump deliberately
      # with a re-review. See issue #426.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage.xml
          flags: engine
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
