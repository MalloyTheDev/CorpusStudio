name: web

on:
  push:
    paths:
      - "apps/web/**"
      - "docs/contracts/**"
      - "engine/corpus_studio/platform/**"
      # The pinned pydantic drives JSON Schema serialization; a bump here can shift the committed
      # contracts, so re-run the regenerate+verify drift gate when the pin (or the extras) changes.
      - "engine/constraints.txt"
      - "engine/pyproject.toml"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "docs/contracts/**"
      - "engine/corpus_studio/platform/**"
      - "engine/constraints.txt"
      - "engine/pyproject.toml"
      - ".github/workflows/web.yml"

# Least privilege: typecheck + build only needs to read the repository.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          # Do NOT leave the job token in .git/config: this job checks out
          # and RUNS repository code, including from an unreviewed branch.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install schema generator dependencies
        # JSON Schema details can change across pydantic releases. Install pydantic from the shared
        # engine/constraints.txt so this generator runtime and the engine test job (engine-tests.yml)
        # use the SAME pinned pydantic, keeping the committed schema/client diff gate reproducible.
        # Bump the version in that one file (regenerating the committed contracts in the same PR).
        run: python -m pip install -c "$GITHUB_WORKSPACE/engine/constraints.txt" pydantic
      - name: Install (locked)
        run: npm ci
      - name: Regenerate language-neutral schemas
        working-directory: engine
        run: >-
          python -c "from corpus_studio.platform.schema_export import export_json_schemas;
          export_json_schemas('../docs/contracts')"
      - name: Regenerate TypeScript contracts
        run: npm run gen:contracts
      - name: Verify committed contract clients are current
        run: |
          changes="$(git -C ../.. status --porcelain --untracked-files=all -- docs/contracts apps/web/src/contracts)"
          if [[ -n "$changes" ]]; then
            echo "$changes"
            git -C ../.. diff -- docs/contracts apps/web/src/contracts
            echo "Regenerate and commit the JSON Schema and TypeScript contract clients."
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  # The Tauri client's Rust core (src-tauri) is compiled by no other job, so a break there - or in a
  # #[tauri::command] wired into the app - ships uncaught (the `web` job above is TS-only). Compile and
  # lint it here, on the same apps/web/** trigger. (#520; the tauri BUNDLE + release job still remain.)
  tauri-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # This job compiles repository code, including from an unreviewed branch; keep no token in .git.
          persist-credentials: false
      - name: Install Tauri Linux system dependencies
        # Tauri 2 links the system webkit2gtk / gtk stack, so even `cargo check` needs these headers.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev
      - name: cargo check (src-tauri, locked)
        working-directory: apps/web/src-tauri
        run: cargo check --locked
      - name: cargo clippy (deny warnings)
        working-directory: apps/web/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
